plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.example.tasks'
version = '1.0.0'

repositories {
    mavenCentral()
}

def vertxVersion = '5.1.6'
def mainClassName = 'io.vertx.launcher.application.VertxApplication'
def mainVerticleName = 'com.example.tasks.MainVerticle'

application {
    mainClass.set(mainClassName)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jacoco {
    toolVersion = "0.8.15"
}

dependencies {
    implementation platform("io.vertx:vertx-stack-depchain:$vertxVersion")
    implementation 'io.vertx:vertx-core'
    implementation 'io.vertx:vertx-config'
    implementation 'io.vertx:vertx-web'
    implementation 'io.vertx:vertx-pg-client'
    implementation 'io.vertx:vertx-launcher-application'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic:1.5.3'

    testImplementation platform("io.vertx:vertx-stack-depchain:$vertxVersion")
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'io.vertx:vertx-junit5'
    testImplementation 'io.vertx:vertx-web-client'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                minimum = 0.95
            }
        }
    }
}

tasks.named('checkstyleTest') {
    enabled = false
}

shadowJar {
    archiveClassifier.set('fat')
    archiveBaseName.set('vertx-background-tasks')
    manifest {
        attributes 'Main-Class'   : mainClassName
        attributes 'Main-Verticle': mainVerticleName
    }
    mergeServiceFiles()
}

checkstyle {
    toolVersion = '14.0.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
    maxErrors = 0
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
    options.encoding = 'UTF-8'
}

tasks.named('shadowJar') {
    dependsOn 'checkstyleMain'
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('run') {
    systemProperty 'vertx-config-path', 'config/app/config.json'
    args = [mainVerticleName]
}
